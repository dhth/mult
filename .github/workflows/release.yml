name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: go goreleaser cosign
      - name: Release binaries
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
